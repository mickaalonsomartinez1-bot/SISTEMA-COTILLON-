<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Conjunto · Angel's Design × Cotillón Arcoíris</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1B4FCC;--blue-pale:#EFF4FF;
  --orange:#F97316;--orange-pale:#FFF7ED;
  --black:#0A0A0A;--white:#fff;--gray:#7C8894;--gray-light:#F7F8FA;--gray-border:#E5E7EB;
  --red:#DC2626;--red-pale:#FEF2F2;--green:#059669;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--gray-light);color:var(--black);}
.disp{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}
.wrap{max-width:980px;margin:0 auto;}
.in{width:100%;border:1.5px solid var(--gray-border);border-radius:8px;padding:10px 12px;font-size:.9rem;outline:none;font-family:'Inter',sans-serif;}
.in:focus{border-color:var(--blue);}
select.in{background:#fff;}
.btn{border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-black{background:var(--black);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-ghost{background:#fff;border:1.5px solid var(--gray-border);}
.card{background:#fff;border:1px solid var(--gray-border);border-radius:14px;padding:16px;}
.label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);margin-bottom:6px;display:block;}
.pill{border-radius:999px;padding:4px 10px;font-size:.7rem;font-weight:700;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
table{width:100%;border-collapse:collapse;font-size:.88rem;}
th{text-align:left;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);padding:8px 10px;border-bottom:1px solid #F0F1F3;}
td{padding:10px;border-bottom:1px solid #F5F6F7;}
tr:last-child td{border-bottom:none;}
.tab{padding:10px 14px;font-size:.78rem;font-weight:700;border:none;background:none;color:var(--gray);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
.tab.active{color:var(--blue);border-color:var(--blue);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow-y:auto;}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;margin:auto;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid5{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:640px){.grid5{grid-template-columns:repeat(5,1fr);}}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar-track{flex:1;background:#F0F1F3;border-radius:6px;height:18px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;}
</style>
</head>

  cotillon: { label: "Cotillón Arcoíris",  color: "#F97316", pale: "#FFF7ED", logo: LOGO_COTILLON },
};

let session = null, me = { label: "", role: "angels" };
let tab = "dashboard";
let selectedPedidos = [];
let selectedInvoices = [];
let products = [], movements = [], invoices = [], pedidos = [], notas = [];
let channel = null;

const app = document.getElementById("app");
const money = (n) => Number(n || 0).toLocaleString("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
const fmtDate = (iso) => new Date(iso).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const roleOf = (r) => ROLES[r] || ROLES.angels;
const dot = (role) => `<span class="dot" style="background:${roleOf(role).color}"></span>`;
const avatar = (role, size) => {
  const s = size || 18;
  return `<img src="${roleOf(role).logo}" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1.5px solid ${roleOf(role).color}22;background:#fff;" />`;
};

/* ======================================================
   Auth
   ====================================================== */
async function init() {
  const { data } = await supabase.auth.getSession();
  session = data.session;
  if (session) { setMe(); await loadAll(); subscribeRealtime(); }
  render();
}
const ADMIN_EMAIL = "angels@interno.com";
const CATEGORIES = ["Cortantes", "Vinchas", "Topper", "Cotillón"];
function setMe() {
  me = {
    label: session.user.user_metadata?.label || session.user.email,
    role: session.user.user_metadata?.role === "cotillon" ? "cotillon" : "angels",
    email: session.user.email,
    isAdmin: session.user.email === ADMIN_EMAIL,
  };
}
supabase.auth.onAuthStateChange((_e, s) => {
  session = s;
  if (s) { setMe(); loadAll().then(() => { subscribeRealtime(); render(); }); }
  else render();
});
async function login(email, password, errEl) {
  errEl.textContent = "Ingresando...";
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) errEl.textContent = "Usuario o contraseña incorrectos.";
}
async function logout() { await supabase.auth.signOut(); if (channel) supabase.removeChannel(channel); }

/* ======================================================
   Data
   ====================================================== */
async function loadAll() {
  const [p, m, i, pe, no] = await Promise.all([
    supabase.from("products").select("*").order("name"),
    supabase.from("movements").select("*").order("created_at", { ascending: false }).limit(300),
    supabase.from("invoices").select("*").order("created_at", { ascending: false }),
    supabase.from("pedidos").select("*").order("created_at", { ascending: false }),
    supabase.from("notas").select("*").order("created_at", { ascending: false }).limit(100),
  ]);
  products = p.data || []; movements = m.data || []; invoices = i.data || [];
  pedidos = pe.data || []; notas = no.data || [];
}
function subscribeRealtime() {
  if (channel) supabase.removeChannel(channel);
  channel = supabase.channel("sync")
    .on("postgres_changes", { event: "*", schema: "public", table: "products" }, () => loadAll().then(render))
    .on("postgres_changes", { event: "*", schema: "public", table: "movements" }, () => loadAll().then(render))
    .on("postgres_changes", { event: "*", schema: "public", table: "invoices" }, () => loadAll().then(render))
    .on("postgres_changes", { event: "*", schema: "public", table: "pedidos" }, () => loadAll().then(render))
    .on("postgres_changes", { event: "*", schema: "public", table: "notas" }, () => loadAll().then(render))
    .subscribe();
}
async function nextInvoiceNumber() {
  const { data } = await supabase.from("invoices").select("number").order("created_at", { ascending: false }).limit(200);
  let maxN = 0;
  (data || []).forEach((inv) => {
    const m = /AD-(\d+)/.exec(inv.number || "");
    if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
  });
  return `AD-${String(maxN + 1).padStart(4, "0")}`;
}
async function logMovement(type, extra) {
  await supabase.from("movements").insert({ user_label: me.label, user_role: me.role, type, ...extra });
}

   Render root
   ====================================================== */
function render() { session ? renderShell() : renderLogin(); }

  app.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;">
      <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--orange));display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
        <span style="color:#fff;font-size:22px;">📦</span>
      </div>
      <p class="disp" style="font-size:1.7rem;margin:0;">SISTEMA CONJUNTO</p>
      <p style="color:var(--gray);font-size:.85rem;margin:2px 0 26px;">Angel's Design × Cotillón Arcoíris</p>
      <div class="card" style="width:100%;max-width:320px;">
        <label class="label">Email</label>
        <input id="loginEmail" class="in" style="margin-bottom:12px;" placeholder="tu@email.com" />
        <label class="label">Contraseña</label>
        <input id="loginPass" type="password" class="in" style="margin-bottom:16px;" placeholder="••••••••" />
        <button id="loginBtn" class="btn btn-blue" style="width:100%;">Ingresar</button>
        <p id="loginErr" style="color:var(--red);font-size:.78rem;margin-top:10px;min-height:16px;"></p>
      </div>
    </div>`;
  document.getElementById("loginBtn").onclick = () =>
    login(document.getElementById("loginEmail").value.trim(), document.getElementById("loginPass").value, document.getElementById("loginErr"));
}

function notasReadKey() { return `notas_read_${session.user.id}`; }
function unreadNotasCount() {
  const lastRead = localStorage.getItem(notasReadKey()) || "1970-01-01";
  return notas.filter((n) => n.user_role !== me.role && new Date(n.created_at) > new Date(lastRead)).length;
}
function markNotasRead() { localStorage.setItem(notasReadKey(), new Date().toISOString()); }

function renderShell() {
  const r = roleOf(me.role);
  const unread = unreadNotasCount();
  app.innerHTML = `
    <div style="height:6px;border-radius:6px;margin-bottom:14px;background:linear-gradient(90deg,#1B4FCC,#3B82F6,#22D3EE,#FACC15,#F97316);"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 0 14px;flex-wrap:wrap;gap:10px;">
      <div style="display:flex;align-items:center;gap:14px;">
        <img src="${LOGO_ANGELS}" style="height:56px;width:auto;" />
        <span style="color:var(--gray-border);font-size:1.4rem;">×</span>
        <img src="${LOGO_COTILLON}" style="height:56px;width:auto;" />
      </div>
      <button id="logoutBtn" class="pill" style="background:${r.pale};color:${r.color};border:none;cursor:pointer;display:flex;align-items:center;">${avatar(me.role,26)}${esc(me.label)} · Salir</button>
    </div>
    <div style="margin:-8px 0 14px;">
      <p class="disp" style="font-size:1.35rem;margin:0;">SISTEMA <span style="color:var(--blue);">ANGEL'S</span> <span style="color:var(--orange);">× COTILLÓN</span></p>
      <p style="font-size:.65rem;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;margin:2px 0 0;">Sincronizado en vivo</p>
    </div>
    <div style="display:flex;gap:2px;border-bottom:1px solid var(--gray-border);overflow-x:auto;margin-bottom:16px;">
      ${tabBtn("dashboard","Resumen")}${tabBtn("productos","Productos")}${tabBtn("stock","Stock")}${tabBtn("pedidos","Pedidos")}${tabBtn("facturas","Facturas")}${tabBtn("notas","Mensajes",unread)}${tabBtn("historial","Historial")}
    </div>
    <div id="tabContent"></div>`;
  document.getElementById("logoutBtn").onclick = logout;
  document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; render(); }));

  const c = document.getElementById("tabContent");
  if (tab === "dashboard") { c.innerHTML = renderDashboard(); bindHistorial(); }
  if (tab === "productos") { c.innerHTML = renderProductos(); bindProductos(); }
  if (tab === "stock") { c.innerHTML = renderStock(); bindStock(); }
  if (tab === "pedidos") { c.innerHTML = renderPedidos(); bindPedidos(); }
  if (tab === "facturas") { c.innerHTML = renderFacturas(); bindFacturas(); }
  if (tab === "notas") { c.innerHTML = renderNotas(); bindNotas(); markNotasRead(); }
  if (tab === "historial") { c.innerHTML = renderHistorial(); bindHistorial(); }

  const goStock = document.getElementById("goStock");
  if (goStock) goStock.onclick = () => { tab = "stock"; render(); };
  const goPedidos = document.getElementById("goPedidos");
  if (goPedidos) goPedidos.onclick = () => { tab = "pedidos"; render(); };
}
function tabBtn(id, label, badge) {
  const badgeHtml = badge ? `<span style="background:var(--red);color:#fff;border-radius:999px;padding:1px 6px;font-size:.62rem;margin-left:5px;">${badge}</span>` : "";
  return `<button class="tab ${tab === id ? "active" : ""}" data-tab="${id}">${label}${badgeHtml}</button>`;
}
function emptyState(text) { return `<div style="border:1.5px dashed var(--gray-border);border-radius:12px;padding:28px;text-align:center;color:#9AA6B0;font-size:.85rem;">${text}</div>`; }

/* ======================================================
   Dashboard: stats + más vendidos + recomendaciones
   ====================================================== */
function salesByProduct() {
  const map = {};
  movements.filter((m) => m.type === "venta").forEach((m) => {
    map[m.product_name] = (map[m.product_name] || 0) + (m.qty || 0);
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

function renderDashboard() {
  const critical = products.filter((p) => (p.stock || 0) <= p.critical_stock);
  const totalUnits = products.reduce((s, p) => s + (p.stock || 0), 0);
  const pendientes = pedidos.filter((p) => p.status === "pendiente");
  const top = salesByProduct().slice(0, 5);
  const maxSold = top.length ? top[0][1] : 1;

  // Recomendación: productos que más se venden y ya están cerca del crítico
  const soldMap = Object.fromEntries(salesByProduct());
  const recos = products
    .filter((p) => (soldMap[p.name] || 0) > 0 && (p.stock || 0) <= p.critical_stock * 1.8)
    .sort((a, b) => (soldMap[b.name] || 0) - (soldMap[a.name] || 0))
    .slice(0, 4);

  return `
    <div class="grid5" style="margin-bottom:20px;">
      ${statCard(products.length, "Productos")}
      ${statCard(totalUnits, "Unidades stock")}
      ${statCard(critical.length, "Stock crítico", critical.length > 0)}
      ${statCard(pendientes.length, "Pedidos pendientes", pendientes.length > 0, "orange")}
      ${statCard(invoices.length, "Facturas")}
    </div>

    ${critical.length > 0 ? `
      <div class="card" style="border-color:#FCA5A5;background:var(--red-pale);margin-bottom:16px;">
        <p style="font-weight:800;color:var(--red);font-size:.85rem;margin:0 0 10px;">⚠️ Necesitan reposición urgente</p>
        ${critical.map((p) => `<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:3px 0;">
          <span><b>${esc(p.name)}</b> <span style="color:#9AA6B0;">· ${esc(p.code)}</span></span>
          <span style="color:var(--red);font-weight:700;">${p.stock || 0} / mín. ${p.critical_stock}</span></div>`).join("")}
        <button id="goStock" style="background:none;border:none;color:var(--red);font-weight:700;font-size:.75rem;text-decoration:underline;padding:0;margin-top:8px;cursor:pointer;">Ir a reponer stock →</button>
      </div>` : ""}

    ${pendientes.length > 0 ? `
      <div class="card" style="border-color:#FED7AA;background:var(--orange-pale);margin-bottom:16px;">
        <p style="font-weight:800;color:var(--orange);font-size:.85rem;margin:0 0 6px;">📋 Tenés ${pendientes.length} pedido(s) esperando</p>
        <button id="goPedidos" style="background:none;border:none;color:var(--orange);font-weight:700;font-size:.75rem;text-decoration:underline;padding:0;cursor:pointer;">Ver pedidos →</button>
      </div>` : ""}

    ${recos.length > 0 ? `
      <div class="card" style="margin-bottom:16px;">
        <p class="label" style="margin-bottom:10px;">💡 Recomendado reponer pronto</p>
        <p style="font-size:.78rem;color:var(--gray);margin:0 0 10px;">Se venden rápido y están quedando bajos de stock.</p>
        ${recos.map((p) => `<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:1px solid #F5F6F7;">
          <span><b>${esc(p.name)}</b></span>
          <span style="color:var(--gray);">${soldMap[p.name] || 0} vendidos · stock ${p.stock || 0}</span></div>`).join("")}
      </div>` : ""}

    <div class="card" style="margin-bottom:16px;">
      <p class="label" style="margin-bottom:10px;">🏆 Productos más vendidos</p>
      ${top.length === 0 ? emptyState("Todavía no hay ventas registradas.") : top.map(([name, qty]) => `
        <div class="bar-row">
          <span style="width:130px;font-size:.8rem;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(name)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(qty / maxSold) * 100}%;background:var(--blue);"></div></div>
          <span style="font-size:.78rem;font-weight:700;width:34px;text-align:right;">${qty}</span>
        </div>`).join("")}
    </div>

    <p class="label" style="margin-bottom:8px;">Actividad reciente</p>
    ${movements.length === 0 ? emptyState("Todavía no hay movimientos.") : `<div class="card" style="padding:0;">${movements.slice(0,6).map(movementRow).join("")}</div>`}
  `;
}
function statCard(value, label, alert, color) {
  const c = alert ? (color === "orange" ? "var(--orange)" : "var(--red)") : "var(--black)";
  const bg = alert ? (color === "orange" ? "var(--orange-pale)" : "var(--red-pale)") : "#fff";
  const bd = alert ? (color === "orange" ? "#FED7AA" : "#FCA5A5") : "var(--gray-border)";
  return `<div class="card" style="background:${bg};border-color:${bd};">
    <p class="disp" style="font-size:1.5rem;margin:0;color:${c};">${value}</p>
    <p style="font-size:.62rem;font-weight:700;text-transform:uppercase;color:var(--gray);margin:2px 0 0;">${label}</p></div>`;
}
function movementRow(m) {
  const meta = {
    venta: ["🔻","Venta"], reposicion: ["🔺","Reposición"], producto_creado: ["➕","Producto creado"],
    producto_editado: ["✏️","Producto editado"], producto_eliminado: ["🗑️","Producto eliminado"],
    pedido_creado: ["📋","Pedido creado"], pedido_completado: ["✅","Pedido completado"], nota: ["📝","Nota"],
  }[m.type] || ["•", m.type];
  return `<div style="display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #F5F6F7;">
    <span>${meta[0]}</span>
    <div style="flex:1;">
      <p style="margin:0;font-size:.85rem;"><b>${meta[1]}</b>${m.product_name ? " · " + esc(m.product_name) : ""}${typeof m.qty === "number" ? " · " + m.qty + " u." : ""}</p>
      <p style="margin:2px 0 0;font-size:.72rem;color:#9AA6B0;display:flex;align-items:center;gap:2px;">${fmtDate(m.created_at)} · ${avatar(m.user_role,14)}<b>${esc(m.user_label)}</b>${m.note ? " · " + esc(m.note) : ""}</p>
    </div>
    ${me.isAdmin ? `<button data-delmov="${m.id}" title="Borrar" style="border:none;background:none;color:#D1D5DB;cursor:pointer;">✕</button>` : ""}
    </div>`;
}

/* ======================================================
   Productos
   ====================================================== */
function renderProductos() {
  return `<div style="display:flex;gap:8px;margin-bottom:14px;">
    <input id="qSearch" class="in" placeholder="Buscar por nombre o código..." />
    <button id="newProd" class="btn btn-blue" style="white-space:nowrap;">+ Producto</button>
  </div>
  <div id="prodTableWrap">${productsTable(products)}</div>
  <div id="prodModalWrap"></div>`;
}
function productsTable(list) {
  if (list.length === 0) return emptyState(products.length === 0 ? "Cargá el primer producto para empezar." : "No hay resultados.");
  return `<div class="card" style="padding:0;overflow:hidden;"><table>
    <thead><tr><th>Código</th><th>Nombre</th><th>Precio</th><th>Stock</th><th></th></tr></thead>
    <tbody>${list.map((p) => `<tr>
      <td style="font-family:monospace;color:var(--gray);font-size:.78rem;">${esc(p.code)}</td>
      <td><b>${esc(p.name)}</b><br><span style="color:#9AA6B0;font-size:.72rem;">${esc(p.category)}</span></td>
      <td>${money(p.price)}</td>
      <td>${p.stock || 0}</td>
      <td style="text-align:right;"><button data-edit="${p.id}" style="border:none;background:none;cursor:pointer;">✏️</button>
      <button data-del="${p.id}" style="border:none;background:none;cursor:pointer;">🗑️</button></td>
    </tr>`).join("")}</tbody></table></div>`;
}
function bindProductos() {
  document.getElementById("newProd").onclick = () => openProdModal(null);
  document.getElementById("qSearch").oninput = (e) => {
    const q = e.target.value.toLowerCase();
    document.getElementById("prodTableWrap").innerHTML = productsTable(products.filter((p) => p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)));
    bindTableActions();
  };
  bindTableActions();
}
function bindTableActions() {
  document.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => openProdModal(products.find((p) => p.id === b.dataset.edit))));
  document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
    const p = products.find((x) => x.id === b.dataset.del);
    if (!confirm(`¿Eliminar "${p.name}"?`)) return;
    await supabase.from("products").delete().eq("id", p.id);
    await logMovement("producto_eliminado", { product_name: p.name, note: `Código ${p.code}` });
  }));
}
function openProdModal(p) {
  const wrap = document.getElementById("prodModalWrap");
  wrap.innerHTML = `<div class="modal-bg"><div class="modal">
    <p class="disp" style="font-size:1.2rem;margin:0 0 14px;">${p ? "Editar producto" : "Nuevo producto"}</p>
    <label class="label">Código</label><input id="fCode" class="in" style="margin-bottom:10px;" value="${p ? esc(p.code) : ""}" placeholder="Ej: COT-0012" />
    <label class="label">Nombre</label><input id="fName" class="in" style="margin-bottom:10px;" value="${p ? esc(p.name) : ""}" placeholder="Ej: Globo metalizado corazón" />
    <label class="label">Categoría</label>
    <select id="fCat" class="in" style="margin-bottom:10px;">
      ${CATEGORIES.map((c) => `<option value="${c}" ${p && p.category === c ? "selected" : ""}>${c}</option>`).join("")}
    </select>
    <div class="grid2" style="margin-bottom:14px;">
      <div><label class="label">Precio</label><input id="fPrice" type="number" class="in" value="${p ? p.price : ""}" placeholder="0" /></div>
      <div><label class="label">Stock crítico</label><input id="fCrit" type="number" class="in" value="${p ? p.critical_stock : "5"}" placeholder="5" /></div>
    </div>
    <button id="fSave" class="btn btn-blue" style="width:100%;margin-bottom:8px;">Guardar</button>
    <button id="fCancel" class="btn btn-ghost" style="width:100%;">Cancelar</button>
  </div></div>`;
  document.getElementById("fCancel").onclick = () => (wrap.innerHTML = "");
  document.getElementById("fSave").onclick = async () => {
    const code = document.getElementById("fCode").value.trim();
    const name = document.getElementById("fName").value.trim();
    const category = document.getElementById("fCat").value.trim() || "General";
    const price = Number(document.getElementById("fPrice").value) || 0;
    const criticalStock = Number(document.getElementById("fCrit").value) || 0;
    if (!code || !name) return;
    if (p) {
      await supabase.from("products").update({ code, name, category, price, critical_stock: criticalStock }).eq("id", p.id);
      await logMovement("producto_editado", { product_name: name, note: "Datos actualizados" });
    } else {
      await supabase.from("products").insert({ code, name, category, price, critical_stock: criticalStock, stock: 0 });
      await logMovement("producto_creado", { product_name: name, note: `Código ${code}` });
    }
    wrap.innerHTML = "";
  };
}

/* ======================================================
   Stock (venta / reposición manual)
   ====================================================== */
let stockCategory = "Todas";
function renderStock() {
  if (products.length === 0) return emptyState("Cargá productos primero en la pestaña Productos.");
  const cats = ["Todas", ...CATEGORIES];
  const list = stockCategory === "Todas" ? products : products.filter((p) => p.category === stockCategory);
  const canVenta = me.role === "cotillon" || me.isAdmin;
  const canRepo = me.role === "angels" || me.isAdmin;
  return `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
      ${cats.map((c) => `<button data-cat="${esc(c)}" class="pill" style="border:1.5px solid ${stockCategory === c ? "var(--blue)" : "var(--gray-border)"};background:${stockCategory === c ? "var(--blue-pale)" : "#fff"};color:${stockCategory === c ? "var(--blue)" : "var(--gray)"};cursor:pointer;">${esc(c)}</button>`).join("")}
    </div>
    <div class="card" style="padding:0;overflow:hidden;"><table>
    <thead><tr><th>Producto</th><th>Categoría</th><th>Stock</th><th></th></tr></thead>
    <tbody>${list.map((p) => {
      const low = (p.stock || 0) <= p.critical_stock;
      return `<tr><td><b>${esc(p.name)}</b><br><span style="color:#9AA6B0;font-size:.72rem;font-family:monospace;">${esc(p.code)}</span></td>
        <td style="color:var(--gray);font-size:.78rem;">${esc(p.category)}</td>
        <td><b style="color:${low ? "var(--red)" : "var(--black)"};">${p.stock || 0}</b>${low ? ' <span style="color:var(--red);font-size:.65rem;font-weight:700;">CRÍTICO</span>' : ""}</td>
        <td style="text-align:right;white-space:nowrap;">
          ${canVenta ? `<button data-venta="${p.id}" class="pill" style="background:var(--red-pale);color:var(--red);border:none;cursor:pointer;margin-right:4px;">🔻 Venta</button>` : ""}
          ${canRepo ? `<button data-repo="${p.id}" class="pill" style="background:var(--blue-pale);color:var(--blue);border:none;cursor:pointer;">🔺 Reponer</button>` : ""}
        </td></tr>`;
    }).join("")}</tbody></table></div><div id="stockModalWrap"></div>`;
}
function bindStock() {
  document.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { stockCategory = b.dataset.cat; render(); }));
  document.querySelectorAll("[data-venta]").forEach((b) => (b.onclick = () => openStockModal(products.find((p) => p.id === b.dataset.venta), "venta")));
  document.querySelectorAll("[data-repo]").forEach((b) => (b.onclick = () => openStockModal(products.find((p) => p.id === b.dataset.repo), "reposicion")));
}
function openStockModal(p, type) {
  const wrap = document.getElementById("stockModalWrap");
  wrap.innerHTML = `<div class="modal-bg"><div class="modal">
    <p class="disp" style="font-size:1.1rem;margin:0 0 14px;">${type === "venta" ? "Registrar venta" : "Reponer stock"} · ${esc(p.name)}</p>
    <label class="label">Cantidad</label><input id="mQty" type="number" class="in" style="margin-bottom:10px;" placeholder="0" />
    <label class="label">Nota (opcional)</label><input id="mNote" class="in" style="margin-bottom:12px;" placeholder="${type === "venta" ? "Ej: venta mostrador" : "Ej: llegó del depósito"}" />
    ${type === "reposicion" ? `<p style="font-size:.75rem;color:var(--gray);background:var(--gray-light);border-radius:8px;padding:8px 10px;margin-bottom:12px;">Se genera automáticamente una factura por ${money(p.price)} × cantidad.</p>` : ""}
    <button id="mConfirm" class="btn ${type === "venta" ? "btn-red" : "btn-blue"}" style="width:100%;margin-bottom:8px;">Confirmar ${type === "venta" ? "venta" : "reposición"}</button>
    <button id="mCancel" class="btn btn-ghost" style="width:100%;">Cancelar</button>
  </div></div>`;
  document.getElementById("mCancel").onclick = () => (wrap.innerHTML = "");
  document.getElementById("mConfirm").onclick = async () => {
    const n = Number(document.getElementById("mQty").value);
    if (!n || n <= 0) return;
    const note = document.getElementById("mNote").value.trim();
    const delta = type === "venta" ? -n : n;
    const resultingStock = Math.max(0, (p.stock || 0) + delta);
    await supabase.from("products").update({ stock: resultingStock }).eq("id", p.id);
    await logMovement(type, { product_id: p.id, product_name: p.name, qty: n, note, resulting_stock: resultingStock });
    if (type === "reposicion") {
      const number = await nextInvoiceNumber();
      await supabase.from("invoices").insert({ number, user_label: me.label, total: p.price * n,
        items: [{ productId: p.id, name: p.name, code: p.code, qty: n, price: p.price, subtotal: p.price * n }] });
    }
    wrap.innerHTML = "";
  };
}

/* ======================================================
   Pedidos (Cotillón o Angel's puede cargar; se completa y genera factura)
   ====================================================== */
function renderPedidos() {
  const pend = pedidos.filter((p) => p.status === "pendiente");
  const resto = pedidos.filter((p) => p.status !== "pendiente");
  const canManage = me.role === "angels" || me.isAdmin;
  selectedPedidos = selectedPedidos.filter((id) => pedidos.some((p) => p.id === id && p.status !== "combinado"));
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap;">
    ${canManage && selectedPedidos.length >= 2
      ? `<button id="unirPedidos" class="btn btn-blue">🧾 Unir ${selectedPedidos.length} pedidos en uno</button>`
      : `<span></span>`}
    <button id="newPedido" class="btn btn-orange">+ Nuevo pedido</button>
  </div>
  <p class="label" style="margin-bottom:8px;">Pendientes (${pend.length})</p>
  ${pend.length === 0 ? emptyState("No hay pedidos pendientes.") : pend.map((pe) => pedidoCard(pe, canManage)).join("")}
  ${resto.length > 0 ? `<p class="label" style="margin:20px 0 8px;">Historial de pedidos</p>${resto.filter((p) => p.status !== "combinado").map((pe) => pedidoCard(pe, canManage)).join("")}` : ""}
  <div id="pedidoModalWrap"></div>`;
}
function pedidoCard(pe, canManage) {
  const r = roleOf(pe.requested_role);
  const statusColor = pe.status === "pendiente" ? "var(--orange)" : pe.status === "completado" ? "var(--green)" : "var(--red)";
  const statusBg = pe.status === "pendiente" ? "var(--orange-pale)" : pe.status === "completado" ? "#ECFDF5" : "var(--red-pale)";
  const checked = selectedPedidos.includes(pe.id);
  const puedeSeleccionar = canManage && pe.status !== "cancelado";
  return `<div class="card" style="margin-bottom:10px;${checked ? "border-color:var(--blue);background:var(--blue-pale);" : ""}">
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;">
      <div style="display:flex;align-items:start;gap:8px;">
        ${puedeSeleccionar ? `<input type="checkbox" data-selped="${pe.id}" ${checked ? "checked" : ""} style="margin-top:3px;width:16px;height:16px;accent-color:var(--blue);" />` : ""}
        <div>
          <p style="margin:0;font-size:.8rem;color:var(--gray);display:flex;align-items:center;gap:2px;">${fmtDate(pe.created_at)} · ${avatar(pe.requested_role,16)}<b>${esc(pe.requested_by)}</b></p>
          ${pe.note ? `<p style="margin:4px 0 0;font-size:.82rem;">"${esc(pe.note)}"</p>` : ""}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="pill" style="background:${statusBg};color:${statusColor};">${pe.status}</span>
        ${me.isAdmin ? `<button data-editped="${pe.id}" title="Editar cantidades / productos" style="border:none;background:none;color:#9AA6B0;cursor:pointer;">✏️</button>` : ""}
        ${me.isAdmin ? `<button data-delped="${pe.id}" title="Borrar pedido" style="border:none;background:none;color:#D1D5DB;cursor:pointer;">✕</button>` : ""}
      </div>

function openEditPedidoModal(pe) {

  function renderRows() {
    return rows.map((row, i) => `

        <button data-rmrow="${i}" class="btn btn-ghost" style="padding:8px 10px;">✕</button>
      </div>`).join("");
  }
  function paint() {
    wrap.innerHTML = `<div class="modal-bg"><div class="modal">
      <p class="disp" style="font-size:1.2rem;margin:0 0 6px;">Editar pedido</p>
      ${pe.status === "completado" ? `<p style="font-size:.72rem;color:var(--orange);background:var(--orange-pale);border-radius:8px;padding:8px 10px;margin-bottom:14px;">Este pedido ya está completado: al guardar, el stock se ajusta solo según la diferencia${pe.invoice_id ? ", y la factura vinculada se actualiza sola." : ". Si ya generó una factura pero no está vinculada (pedidos viejos), revisala a mano en Facturas."}</p>` : ""}
      <div id="rowsWrap">${renderRows()}</div>
      <button id="addRow" class="btn btn-ghost" style="width:100%;margin-bottom:14px;font-size:.8rem;">+ Agregar otro producto</button>
      <button id="peSaveEdit" class="btn btn-blue" style="width:100%;margin-bottom:8px;">Guardar cambios</button>
      <button id="peCancelEdit" class="btn btn-ghost" style="width:100%;">Cancelar</button>
    </div></div>`;
    document.querySelectorAll(".row-prod").forEach((el, i) => (el.onchange = (e) => (rows[i].productId = e.target.value)));
    document.querySelectorAll(".row-qty").forEach((el, i) => (el.oninput = (e) => (rows[i].qty = Number(e.target.value) || 1)));
    document.querySelectorAll("[data-rmrow]").forEach((b) => (b.onclick = () => { rows.splice(Number(b.dataset.rmrow), 1); paint(); }));
    document.getElementById("addRow").onclick = () => { rows.push({ productId: "", qty: 1 }); paint(); };
    document.getElementById("peCancelEdit").onclick = () => (wrap.innerHTML = "");
    document.getElementById("peSaveEdit").onclick = async () => {
      const nuevosItems = rows.filter((r) => r.productId).map((r) => {
        const p = products.find((x) => x.id === r.productId);
        return { product_id: p.id, name: p.name, qty: r.qty };
      });
      if (nuevosItems.length === 0) return;

      if (pe.status === "completado") {
        const oldQtyByProduct = {};
        (pe.items || []).forEach((it) => { oldQtyByProduct[it.product_id] = (oldQtyByProduct[it.product_id] || 0) + it.qty; });
        const newQtyByProduct = {};
        nuevosItems.forEach((it) => { newQtyByProduct[it.product_id] = (newQtyByProduct[it.product_id] || 0) + it.qty; });
        const allProductIds = new Set([...Object.keys(oldQtyByProduct), ...Object.keys(newQtyByProduct)]);
        for (const pid of allProductIds) {
          const delta = (newQtyByProduct[pid] || 0) - (oldQtyByProduct[pid] || 0);
          if (delta === 0) continue;
          const p = products.find((x) => x.id === pid);
          if (!p) continue;
          const resultingStock = Math.max(0, (p.stock || 0) + delta);
          await supabase.from("products").update({ stock: resultingStock }).eq("id", p.id);
          await logMovement("reposicion", { product_id: p.id, product_name: p.name, qty: delta, note: `Corrección de cantidades en pedido de ${pe.requested_by}`, resulting_stock: resultingStock });
        }
      }

      await supabase.from("pedidos").update({ items: nuevosItems }).eq("id", pe.id);

      // Si este pedido tiene una factura vinculada, la actualizamos sola para que coincida
      if (pe.invoice_id) {
        const itemsConPrecio = nuevosItems.map((it) => {
          const p = products.find((x) => x.id === it.product_id);
          const price = p ? p.price : 0;
          return { productId: it.product_id, name: it.name, code: p?.code, qty: it.qty, price, subtotal: price * it.qty };
        });
        const nuevoTotal = itemsConPrecio.reduce((s, it) => s + it.subtotal, 0);
        await supabase.from("invoices").update({ items: itemsConPrecio, total: nuevoTotal }).eq("id", pe.invoice_id);
      }

      wrap.innerHTML = "";
    };
  }
  paint();
}

async function completePedido(pe) {
  for (const it of pe.items || []) {
    const p = products.find((x) => x.id === it.product_id);
    if (!p) continue;
    const resultingStock = (p.stock || 0) + it.qty;
    await supabase.from("products").update({ stock: resultingStock }).eq("id", p.id);
    await logMovement("reposicion", { product_id: p.id, product_name: p.name, qty: it.qty, note: `Pedido de ${pe.requested_by}`, resulting_stock: resultingStock });
  }
  const itemsWithPrice = (pe.items || []).map((it) => {
    const p = products.find((x) => x.id === it.product_id);
    const price = p ? p.price : 0;
    return { productId: it.product_id, name: it.name, code: p?.code, qty: it.qty, price, subtotal: price * it.qty };
  });
  const total = itemsWithPrice.reduce((s, it) => s + it.subtotal, 0);
  const number = await nextInvoiceNumber();
  const { data: nuevaFactura } = await supabase.from("invoices").insert({ number, user_label: me.label, total, items: itemsWithPrice }).select().single();
  await supabase.from("pedidos").update({ status: "completado", completed_at: new Date().toISOString(), completed_by: me.label, invoice_id: nuevaFactura?.id || null }).eq("id", pe.id);
  await logMovement("pedido_completado", { note: `Pedido de ${pe.requested_by} completado` });
}

async function unirPedidos(seleccionados) {
  if (seleccionados.length < 2) return;
  if (!confirm(`¿Unir estos ${seleccionados.length} pedidos en uno solo? Los originales se reemplazan por el pedido unido, con una sola factura.`)) return;

  // 1) Reponer stock SOLO de los que todavía estaban pendientes (los completados ya sumaron su stock antes)
  for (const pe of seleccionados) {
    if (pe.status !== "pendiente") continue;
    for (const it of pe.items || []) {
      const p = products.find((x) => x.id === it.product_id);
      if (!p) continue;
      const resultingStock = (p.stock || 0) + it.qty;
      p.stock = resultingStock;
      await supabase.from("products").update({ stock: resultingStock }).eq("id", p.id);
      await logMovement("reposicion", { product_id: p.id, product_name: p.name, qty: it.qty, note: `Pedido de ${pe.requested_by} (unido)`, resulting_stock: resultingStock });
    }
  }

  // 2) Combinar items de todos, sumando cantidades del mismo producto
  const combinado = {};
  seleccionados.forEach((pe) => {
    (pe.items || []).forEach((it) => {
      if (!combinado[it.product_id]) combinado[it.product_id] = { product_id: it.product_id, name: it.name, qty: 0 };
      combinado[it.product_id].qty += it.qty;
    });
  });
  const itemsUnidos = Object.values(combinado);
  const itemsWithPrice = itemsUnidos.map((it) => {
    const p = products.find((x) => x.id === it.product_id);
    const price = p ? p.price : 0;
    return { productId: it.product_id, name: it.name, code: p?.code, qty: it.qty, price, subtotal: price * it.qty };
  });
  const total = itemsWithPrice.reduce((s, it) => s + it.subtotal, 0);

  // 3) Borrar las facturas individuales que ya existían (de los que estaban completados)
  const facturasViejas = seleccionados.map((pe) => pe.invoice_id).filter(Boolean);
  for (const invId of facturasViejas) {
    await supabase.from("invoices").delete().eq("id", invId);
  }

  // 4) Crear UNA factura nueva con todo junto
  const number = await nextInvoiceNumber();
  const { data: nuevaFactura, error: insErr } = await supabase.from("invoices").insert({ number, user_label: me.label, total, items: itemsWithPrice }).select().single();
  if (insErr || !nuevaFactura) {
    alert("No se pudo crear la factura unida, así que no se tocó ningún pedido. Error: " + (insErr?.message || "desconocido"));
    return;
  }

  // 5) Crear el pedido unido, y marcar los originales como "combinado" (quedan en el historial, sin duplicar)
  const solicitantes = [...new Set(seleccionados.map((p) => p.requested_by))].join(", ");
  await supabase.from("pedidos").insert({
    requested_by: solicitantes, requested_role: me.role, status: "completado", items: itemsUnidos,
    note: `Unión de ${seleccionados.length} pedidos`, completed_at: new Date().toISOString(), completed_by: me.label, invoice_id: nuevaFactura.id,
  });
  for (const pe of seleccionados) {
    await supabase.from("pedidos").update({ status: "combinado" }).eq("id", pe.id);
  }

  await logMovement("nota", { note: `${seleccionados.length} pedidos unidos en factura ${number}` });
  selectedPedidos = [];
}

async function combineInvoices(facturasSeleccionadas) {
  if (facturasSeleccionadas.length < 2) return;
  if (!confirm(`¿Combinar estas ${facturasSeleccionadas.length} facturas en una sola nueva? Las originales se van a borrar y reemplazar por la combinada.`)) return;

  const combinado = {};
  for (const inv of facturasSeleccionadas) {
    for (const it of inv.items || []) {
      const key = it.productId || it.code || it.name;
      if (!combinado[key]) {
        combinado[key] = { productId: it.productId, name: it.name, code: it.code, qty: 0, price: it.price, subtotal: 0 };
      }
      combinado[key].qty += it.qty;
      combinado[key].subtotal += it.subtotal;
    }
  }
  const itemsCombinados = Object.values(combinado);
  const total = itemsCombinados.reduce((s, it) => s + it.subtotal, 0);
  const todasPagadas = facturasSeleccionadas.every((inv) => inv.payment_status === "pagado");
  const number = await nextInvoiceNumber();

  const { data: nuevaFactura, error: insErr } = await supabase.from("invoices").insert({
    number, user_label: me.label, total, items: itemsCombinados,
    payment_status: todasPagadas ? "pagado" : "pendiente",
  }).select().single();

  if (insErr || !nuevaFactura) {
    alert("No se pudo crear la factura combinada, así que NO se borró ninguna de las originales. Error: " + (insErr?.message || "desconocido"));
    return;
  }

  for (const inv of facturasSeleccionadas) {
    const { error: delErr } = await supabase.from("invoices").delete().eq("id", inv.id);
    if (delErr) {
      alert(`La factura combinada ${number} ya se creó, pero no se pudo borrar la original ${inv.number}. Borrala a mano si hace falta.`);
    }
  }

  await logMovement("nota", { note: `Facturas ${facturasSeleccionadas.map((i) => i.number).join(", ")} combinadas en ${number}` });
  selectedInvoices = [];
}

          <th style="text-align:right;padding:8px 10px;font-size:.62rem;letter-spacing:.05em;border-radius:0 6px 6px 0;">TOTAL</th>
        </tr></thead>
        <tbody>${(inv.items||[]).map((it) => `
          <tr style="border-bottom:1px solid #F0F1F3;">
            <td style="padding:8px 10px;font-size:.78rem;color:var(--gray);">${esc(it.code||"—")}</td>
            <td style="padding:8px 10px;font-size:.78rem;font-weight:600;">${esc(it.name)}</td>
            <td style="padding:8px 10px;font-size:.78rem;text-align:right;">${money(it.price)}</td>
            <td style="padding:8px 10px;font-size:.78rem;text-align:right;">${it.qty}</td>
            <td style="padding:8px 10px;font-size:.78rem;text-align:right;font-weight:700;">${money(it.subtotal)}</td>
          </tr>`).join("")}

      </table>

      <div style="display:flex;justify-content:flex-end;align-items:baseline;gap:10px;margin-bottom:20px;">

        <span class="disp" style="font-size:1.7rem;">${money(inv.total)}</span>
      </div>

      <div style="background:#DCC7A0;border-radius:10px;padding:14px 16px;margin-bottom:0;">
        <p style="font-size:.62rem;font-weight:700;letter-spacing:.06em;color:#5C4A2E;margin:0 0 8px;">CONTACTO:</p>
        <div style="display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.76rem;color:#3D3120;">
          <span>✉️ angelsdesign_cba@outlook.com.ar</span>
          <span>📞 +54 9 3513 18-0068</span>
          <span>📍 Panamericano, Córdoba.</span>
        </div>
      </div>
    </div>

    <div style="background:#0A0A0A;color:#fff;text-align:center;padding:12px;margin-top:16px;font-size:.78rem;">
      ALIAS PARA TRANSFERENCIA: <b>angel.alonso.3d</b>
    </div>
    <p style="text-align:center;font-size:.72rem;color:#9AA6B0;padding:12px 20px 0;margin:0;">Gracias por elegirnos!</p>
    </div>

    <div style="display:flex;gap:8px;padding:16px 26px 24px;position:sticky;bottom:0;background:#fff;border-top:1px solid #F0F1F3;">
      <button id="invDownload" class="btn btn-blue" style="flex:1;">⬇️ Descargar PDF</button>
      <button onclick="window.print()" class="btn btn-black" style="flex:1;">🖨️ Imprimir</button>
      ${me.isAdmin ? `<button id="invEdit" class="btn btn-ghost">✏️ Editar</button>` : ""}
      <button id="invCancel" class="btn btn-ghost">Cerrar</button>
    </div>
  </div></div>`;
  document.getElementById("invCancel").onclick = () => (wrap.innerHTML = "");
  const editBtn = document.getElementById("invEdit");
  if (editBtn) editBtn.onclick = () => openEditInvoiceModal(inv);
  document.getElementById("invDownload").onclick = () => {
    try {
      generateInvoicePDF(inv);
    } catch (err) {
      alert("No se pudo generar el PDF. Probá con 'Imprimir' como alternativa.");
      console.error(err);
    }
  };
}

function openEditInvoiceModal(inv) {
  const wrap = document.getElementById("invModalWrap");
  let rows = (inv.items || []).map((it) => ({ ...it }));

  function renderRows() {
    return rows.map((row, i) => `
      <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;" data-row="${i}">
        <span style="flex:2;font-size:.82rem;">${esc(row.name)}</span>
        <input type="number" class="in row-price" style="width:80px;" value="${row.price}" placeholder="Precio" />
        <input type="number" class="in row-qty" style="width:60px;" value="${row.qty}" placeholder="Cant." />
        <button data-rmrow="${i}" class="btn btn-ghost" style="padding:8px 10px;">✕</button>
      </div>`).join("");
  }
  function paint() {
    const total = rows.reduce((s, r) => s + (Number(r.price) || 0) * (Number(r.qty) || 0), 0);
    wrap.innerHTML = `<div class="modal-bg"><div class="modal">
      <p class="disp" style="font-size:1.2rem;margin:0 0 6px;">Editar factura ${esc(inv.number)}</p>
      <p style="font-size:.72rem;color:var(--orange);background:var(--orange-pale);border-radius:8px;padding:8px 10px;margin-bottom:14px;">Esto NO ajusta el stock ni el pedido original — solo corrige el contenido de esta factura.</p>
      <div id="rowsWrapInv">${renderRows()}</div>
      <div style="display:flex;justify-content:space-between;margin:12px 0 16px;font-weight:700;">
        <span>Nuevo total:</span><span class="disp" style="font-size:1.3rem;">${money(total)}</span>
      </div>
      <button id="invSaveEdit" class="btn btn-blue" style="width:100%;margin-bottom:8px;">Guardar cambios</button>
      <button id="invCancelEdit" class="btn btn-ghost" style="width:100%;">Cancelar</button>
    </div></div>`;
    document.querySelectorAll(".row-price").forEach((el, i) => (el.oninput = (e) => { rows[i].price = Number(e.target.value) || 0; paint(); }));
    document.querySelectorAll(".row-qty").forEach((el, i) => (el.oninput = (e) => { rows[i].qty = Number(e.target.value) || 0; paint(); }));
    document.querySelectorAll("[data-rmrow]").forEach((b) => (b.onclick = () => { rows.splice(Number(b.dataset.rmrow), 1); paint(); }));
    document.getElementById("invCancelEdit").onclick = () => (wrap.innerHTML = "");
    document.getElementById("invSaveEdit").onclick = async () => {
      const itemsFinales = rows.map((r) => ({ ...r, subtotal: (Number(r.price) || 0) * (Number(r.qty) || 0) }));
      const totalFinal = itemsFinales.reduce((s, it) => s + it.subtotal, 0);
      await supabase.from("invoices").update({ items: itemsFinales, total: totalFinal }).eq("id", inv.id);
      wrap.innerHTML = "";
    };
  }
  paint();
}

function generateInvoicePDF(inv) {
  const d = new Date(inv.created_at);
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yy = String(d.getFullYear()).slice(-2);
  const entrega = d.toLocaleDateString("es-AR");
  const items = inv.items || [];
  const pageW = 380;
  const pageH = 470 + items.length * 20;
  const pdf = new jsPDF({ unit: "pt", format: [pageW, pageH] });
  const mx = 26;
  let y = 34;

  try { pdf.addImage(LOGO_ANGELS, "PNG", mx, y - 18, 85, 30); } catch (e) {}

  pdf.setFontSize(7);
  pdf.setTextColor(150, 150, 150);
  pdf.text("FECHA", pageW - mx, y - 16, { align: "right" });
  pdf.setFontSize(9);
  pdf.setTextColor(20, 20, 20);
  const boxW = 18, boxH = 14, gap = 4;
  let bx = pageW - mx - (boxW * 3 + gap * 2);
  [dd, mm, yy].forEach((val) => {
    pdf.rect(bx, y - 10, boxW, boxH);
    pdf.text(val, bx + boxW / 2, y, { align: "center" });
    bx += boxW + gap;
  });

  y += 46;
  pdf.setFontSize(22);
  pdf.setTextColor(10, 10, 10);
  pdf.text("Factura", pageW - mx, y, { align: "right" });
  pdf.setFontSize(10);
  pdf.setTextColor(201, 151, 59);
  pdf.text(`N° ${inv.number}`, pageW - mx, y + 14, { align: "right" });

  y += 34;
  pdf.setFillColor(247, 247, 245);
  pdf.roundedRect(mx, y, pageW - mx * 2, 46, 4, 4, "F");
  const colW = (pageW - mx * 2) / 3;
  [["PARA", "Cotillón Arcoíris"], ["ESTADO", inv.payment_status === "pagado" ? "Pagado" : "Pendiente"], ["ENTREGA", entrega]].forEach((info, i) => {
    const cx = mx + 12 + i * colW;
    pdf.setFontSize(6.5); pdf.setTextColor(150, 150, 150);
    pdf.text(info[0], cx, y + 16);
    pdf.setFontSize(9); pdf.setTextColor(20, 20, 20);
    pdf.text(info[1], cx, y + 30);
  });

  y += 62;
  pdf.setFillColor(10, 10, 10);
  pdf.rect(mx, y, pageW - mx * 2, 20, "F");
  pdf.setFontSize(7); pdf.setTextColor(255, 255, 255);
  const colX = [mx + 6, mx + 66, pageW - mx - 100, pageW - mx - 55, pageW - mx - 6];
  pdf.text("CODIGO", colX[0], y + 13);
  pdf.text("PRODUCTO", colX[1], y + 13);
  pdf.text("PRECIO", colX[2], y + 13, { align: "right" });
  pdf.text("CANT.", colX[3], y + 13, { align: "right" });
  pdf.text("TOTAL", colX[4], y + 13, { align: "right" });
  y += 20;

  items.forEach((it) => {
    y += 20;
    pdf.setFontSize(7.5);
    pdf.setTextColor(120, 130, 140);
    pdf.text(String(it.code || "—"), colX[0], y - 5);
    pdf.setTextColor(20, 20, 20);
    pdf.text(String(it.name).slice(0, 28), colX[1], y - 5);
    pdf.text(money(it.price), colX[2], y - 5, { align: "right" });
    pdf.text(String(it.qty), colX[3], y - 5, { align: "right" });
    pdf.setFont(undefined, "bold");
    pdf.text(money(it.subtotal), colX[4], y - 5, { align: "right" });
    pdf.setFont(undefined, "normal");
    pdf.setDrawColor(240, 241, 243);
    pdf.line(mx, y, pageW - mx, y);
  });

  y += 30;
  pdf.setFontSize(10); pdf.setTextColor(120, 130, 140);
  pdf.text("Total:", pageW - mx - 70, y);
  pdf.setFontSize(16); pdf.setTextColor(10, 10, 10);
  pdf.text(money(inv.total), pageW - mx, y, { align: "right" });

  y += 24;
  pdf.setFillColor(220, 199, 160);
  pdf.roundedRect(mx, y, pageW - mx * 2, 56, 4, 4, "F");
  pdf.setFontSize(6.5); pdf.setTextColor(92, 74, 46);
  pdf.text("CONTACTO:", mx + 12, y + 16);
  pdf.setFontSize(7.5); pdf.setTextColor(61, 49, 32);
  pdf.text("angelsdesign_cba@outlook.com.ar", mx + 12, y + 30);
  pdf.text("+54 9 3513 18-0068", mx + 12, y + 42);
  pdf.text("Panamericano, Córdoba.", mx + 170, y + 42);

  y += 70;
  pdf.setFillColor(10, 10, 10);
  pdf.rect(0, y, pageW, 26, "F");
  pdf.setFontSize(8); pdf.setTextColor(255, 255, 255);
  pdf.text("ALIAS PARA TRANSFERENCIA: angel.alonso.3d", pageW / 2, y + 16, { align: "center" });

  y += 36;
  pdf.setFontSize(7.5); pdf.setTextColor(150, 150, 150);
  pdf.text("Gracias por elegirnos!", pageW / 2, y, { align: "center" });

  pdf.save(`factura-${inv.number}.pdf`);
}

/* ======================================================
   Notas
   ====================================================== */
function renderNotas() {
  return `<div class="card" style="margin-bottom:16px;">
    <label class="label">Producto (opcional)</label>
    <select id="notaProd" class="in" style="margin-bottom:10px;"><option value="">Nota general</option>
      ${products.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
    <textarea id="notaText" class="in" style="min-height:70px;margin-bottom:10px;" placeholder="Escribí un mensaje interno para el otro equipo..."></textarea>
    <button id="notaSave" class="btn ${me.role === "cotillon" ? "btn-orange" : "btn-blue"}" style="width:100%;">Enviar mensaje</button>
  </div>
  ${notas.length === 0 ? emptyState("Todavía no hay mensajes.") : notas.map((n) => `
    <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;">
      <div style="flex:1;">
        <p style="margin:0 0 4px;font-size:.78rem;color:var(--gray);display:flex;align-items:center;gap:2px;">${avatar(n.user_role,16)}<b>${esc(n.user_label)}</b> · ${fmtDate(n.created_at)}${n.product_name ? ` · <span style="color:#9AA6B0;">sobre ${esc(n.product_name)}</span>` : ""}</p>
        <p style="margin:0;font-size:.88rem;">${esc(n.text)}</p>
      </div>
      ${me.isAdmin ? `<button data-delnota="${n.id}" title="Borrar" style="border:none;background:none;color:#D1D5DB;cursor:pointer;">✕</button>` : ""}
    </div>`).join("")}`;
}
function bindNotas() {
  document.getElementById("notaSave").onclick = async () => {
    const text = document.getElementById("notaText").value.trim();
    if (!text) return;
    const productId = document.getElementById("notaProd").value;
    const product = products.find((p) => p.id === productId);
    await supabase.from("notas").insert({ user_label: me.label, user_role: me.role, product_id: productId || null, product_name: product?.name || null, text });
    await logMovement("nota", { product_name: product?.name, note: text.slice(0, 60) });
  };
  document.querySelectorAll("[data-delnota]").forEach((b) => (b.onclick = async () => {
    if (!confirm("¿Borrar este mensaje?")) return;
    await supabase.from("notas").delete().eq("id", b.dataset.delnota);
  }));
}

/* ======================================================
   Historial
   ====================================================== */
function renderHistorial() {
  if (movements.length === 0) return emptyState("Todavía no hay actividad registrada.");
  return `<div class="card" style="padding:0;">${movements.map(movementRow).join("")}</div>`;
}
function bindHistorial() {
  document.querySelectorAll("[data-delmov]").forEach((b) => (b.onclick = async () => {
    if (!confirm("¿Borrar esta entrada del historial? Esto no revierte el stock, solo borra el registro.")) return;
    await supabase.from("movements").delete().eq("id", b.dataset.delmov);
  }));
}
